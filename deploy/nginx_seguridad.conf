# Configuración de nginx para el límite de solicitudes y la IP real del cliente (RNF-16). NO se instala sola: nginx corre en la EC2 con su
# propia configuración (la que generó Certbot para api.rentafy-app.com.ar), así que hay que sumar estas piezas a mano.
#
# Por qué importa: el backend (FastAPI) escucha en 127.0.0.1 detrás de nginx, así que TODAS las conexiones le llegan desde loopback. Para
# limitar por IP necesita que nginx le pase la IP real en X-Real-IP; sin eso el backend no limita (a propósito: si no, todos los
# usuarios compartirían un contador) y deja un aviso en el log. Los topes de acá son más laxos que los de la app (RATE_LIMIT_* en config.py):
# nginx corta solo inundaciones, y la app es la que da el mensaje de error con las cabeceras CORS que el navegador necesita para mostrarlo.
#
# 1) En el contexto `http` (por ejemplo /etc/nginx/conf.d/rentafy_limites.conf):
limit_req_zone $binary_remote_addr zone=rentafy_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rentafy_acceso:10m rate=30r/m;
limit_req_status 429;

# 2) Dentro del `server { ... }` de api.rentafy-app.com.ar, en el bloque que hace proxy al backend (hoy algo como `location / { proxy_pass http://127.0.0.1:8000; }`).
#    Lo imprescindible son las tres líneas proxy_set_header; el resto agrega los topes.
#
#    location /auth/ {
#        limit_req zone=rentafy_acceso burst=10 nodelay;
#        proxy_pass http://127.0.0.1:8000;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }
#
#    location / {
#        limit_req zone=rentafy_general burst=100 nodelay;
#        proxy_pass http://127.0.0.1:8000;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }
#
# 3) Probar y recargar (si `nginx -t` falla, no recargues):
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4) Verificar desde afuera que el backend ve la IP real (usa credenciales falsas; bloquea tu IP para el login por 1 minuto):
#      for i in $(seq 1 12); do curl -s -o /dev/null -w "%{http_code} " -X POST https://api.rentafy-app.com.ar/auth/login \
#        -H "Content-Type: application/json" -d '{"email":"nadie@test.com","password":"x"}'; done; echo
#    Esperado: diez 401 y después 429. Si salen doce 401, el backend no está recibiendo X-Real-IP (revisá el paso 2).
