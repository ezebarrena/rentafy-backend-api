name: Deploy a EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ec2-user/rentafy-backend-api
            # El repo es privado: git en la sesión SSH no tiene credenciales propias, así
            # que se autentica el fetch puntual con el GITHUB_TOKEN de la Action (via header,
            # sin persistir nada en la config git del servidor).
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
